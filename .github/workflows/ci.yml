name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  firmware:
    name: Firmware (${{ matrix.sketch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [Mochi_EN, Mochi_TR]
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install U8g2 ArduinoJson "SparkFun MMA8452Q Accelerometer"

      # upload.maximum_size = app partition in partitions.csv (0x180000), so a too-big build fails here.
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc \
            --build-property upload.maximum_size=1572864 \
            --warnings default \
            --export-binaries --output-dir build \
            ${{ matrix.sketch }}
          ls -l build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.sketch }}
          path: build/${{ matrix.sketch }}.ino.merged.bin
          if-no-files-found: error

  tests:
    name: Converter and web UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install pillow pytest playwright
          playwright install --with-deps chromium

      - name: Test
        run: pytest tests -v

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/Mochi_EN/Mochi_EN.ino.merged.bin mochi-en.bin
          cp dist/Mochi_TR/Mochi_TR.ino.merged.bin mochi-tr.bin
          cat > notes.md <<'EOF'
          Prebuilt firmware for the ESP32-C3 SuperMini (4MB flash).

          - `mochi-en.bin`: English web UI
          - `mochi-tr.bin`: Turkish web UI

          Flash at offset `0x0` with [ESP Web Flasher](https://espressif.github.io/esptool-js/) or `esptool --chip esp32c3 write_flash 0x0 mochi-en.bin`. This is a full flash image: it also clears uploaded faces, so upload them again afterwards.

          Default WiFi password: `example1`. Build from source to change it or to calibrate the battery reading.
          EOF
          gh release create "$GITHUB_REF_NAME" mochi-en.bin mochi-tr.bin \
            --repo "$GITHUB_REPOSITORY" --title "Mochi $GITHUB_REF_NAME" --notes-file notes.md
